[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "recurrent-state-lab"
version = "0.1.0"
description = "CPU reference Gated DeltaNet with explicit stream state and reproducible MQAR checks"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "NOTICE", "src/recurrent_state_lab/_vendor/fla/LICENSE", "src/recurrent_state_lab/_vendor/zoology/LICENSE.md"]
dependencies = ["torch>=2.4,<3", "numpy>=1.26,<3", "einops==0.8.1", "psutil>=7,<8"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
recurrent-lab = "recurrent_state_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
recurrent_state_lab = ["_vendor/**/*.py", "_vendor/**/LICENSE*", "_vendor/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

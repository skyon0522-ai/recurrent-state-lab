name: CPU reference checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-verified.txt
      - run: python -m pip install .[test]
      - run: python -m pytest -q
      - run: python -m recurrent_state_lab.cli --output runs/smoke --epochs 1 --train-examples 32 --seeds 7
